site_name: Gmail Auto-Categorizer with NLP
site_description: Documentation for the Gmail Auto-Categorizer project built with NLP and Python.
site_url: https://S1mon009.github.io/NLP-Mailer/
repo_url: https://github.com/S1mon009/NLP-Mailer
repo_name: S1mon009/NLP-Mailer
edit_uri: edit/main/documentation/docs/

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Configuration: configuration.md
  - Usage: usage.md
  - Releases: releases.md

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
      media: "(prefers-color-scheme: light)"
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
      media: "(prefers-color-scheme: dark)"
  features:
    - navigation.expand
    - navigation.instant
    - navigation.top
    - navigation.footer
    - content.code.annotate
    - content.tabs.link
  language: en

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: false
            show_root_toc_entry: true
            show_root_heading: true
            heading_level: 2
            filters:
              - "!^_"
  - autorefs

markdown_extensions:
  - admonition
  - codehilite
  - toc:
      permalink: true
  - tables
  - def_list
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight

extra:
  version:
    provider: mike

  social:
    - icon: fontawesome/brands/github
      link: https://github.com/S1mon009/NLP-Mailer
      name: GitHub Repository
