site_name: Gmail Auto-Categorizer with NLP
site_description: Documentation for the Gmail Auto-Categorizer project built with NLP and Python.
site_url: https://S1mon009.github.io/NLP-Mailer/
repo_url: https://github.com/S1mon009/NLP-Mailer
repo_name: S1mon009/NLP-Mailer
edit_uri: edit/main/documentation/docs/

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Configuration: configuration.md
  - Usage: usage.md
  - Releases: releases.md

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy
    - content.action.view

plugins:
  - search
  - mike:
      alias_type: symlink
      canonical_version: latest
      version_selector: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - tables

extra:
  version:
    provider: mike

  social:
    - icon: fontawesome/brands/github
      link: https://github.com/S1mon009/NLP-Mailer
      name: GitHub Repository
