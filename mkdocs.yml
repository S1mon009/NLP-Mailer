site_name: NLP-Mailer
site_description: Documentation for the NLP-Mailer project built with NLP and Python.
site_url: https://S1mon009.github.io/NLP-Mailer/
repo_url: https://github.com/S1mon009/NLP-Mailer
repo_name: S1mon009/NLP-Mailer
edit_uri: edit/main/documentation/docs/

nav:
  - Home: index.md

  - Getting Started:
      - Installation: getting-started/installation.md
      - Configuration: getting-started/configuration.md
      - Gmail Setup: getting-started/gmail-setup.md
      - First Run: getting-started/first-run.md

  - Guide:
      - Commands: guide/commands.md
      - Email Categorization: guide/email-categorization.md
      - Gmail Labels: guide/labels.md
      - Confidence: guide/confidence.md
      - Machine Learning: guide/machine-learning.md
      - Model Management: guide/model-management.md

  - Architecture:
      - Overview: architecture/overview.md
      - Project Structure: architecture/project-structure.md
      - Application Flow: architecture/application-flow.md
      - ML Pipeline: architecture/ml-pipeline.md

  - API Reference:
      - Overview: api/index.md
      - CLI: api/cli.md
      - Gmail Connector: api/gmail-connector.md
      - Email Categorizer: api/email-categorizer.md
      - Gmail Subject Tagger: api/gmail-subject-tagger.md
      - Configuration: api/configuration.md

  - Development:
      - Local Development: development/local-development.md
      - Testing: development/testing.md
      - Documentation: development/documentation.md
      - Contributing: development/contributing.md

  - Reference:
      - FAQ: reference/faq.md
      - Troubleshooting: reference/troubleshooting.md
      - Configuration Reference: reference/configuration-reference.md
      - Legal: reference/legal.md

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
      media: "(prefers-color-scheme: light)"
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
      media: "(prefers-color-scheme: dark)"
  features:
    - navigation.expand
    - navigation.instant
    - navigation.top
    - navigation.footer
    - content.code.annotate
    - content.tabs.link
  language: en

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: false
            show_root_toc_entry: true
            show_root_heading: true
            heading_level: 2
            filters:
              - "!^_"
  - autorefs

markdown_extensions:
  - admonition
  - codehilite
  - toc:
      permalink: true
  - tables
  - def_list
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight

extra:
  version:
    provider: mike

  social:
    - icon: fontawesome/brands/github
      link: https://github.com/S1mon009/NLP-Mailer
      name: GitHub Repository
